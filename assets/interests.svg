<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Interests: photography, gaming, reading</title>
  <desc id="d">A cyberpunk night city in the rain with a neon sign reading 趣味 (hobbies) and three neon cards: photography, gaming and reading.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0320"/>
      <stop offset="0.75" stop-color="#1C0A42"/>
      <stop offset="1" stop-color="#2A0B4F"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A0638"/>
      <stop offset="1" stop-color="#07021A"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29F3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#29F3FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#29F3FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <clipPath id="ground"><rect x="0" y="250" width="1200" height="70"/></clipPath>
    <style>
      .mono { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace; }
      .jp { font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif; }
      .sign { animation: flicker 6s linear infinite; }
      .win { animation: blink 3.5s steps(1) infinite; }
      .rain { animation: rain linear infinite; }
      .glitch-a { animation: glitchA 5s steps(1) infinite; }
      .glitch-b { animation: glitchB 5s steps(1) infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .sweep { animation: sweep 7s linear infinite; }
      @keyframes flicker { 0%, 18%, 22%, 54%, 58%, 100% { opacity: 1; } 19%, 21%, 55%, 57% { opacity: 0.3; } 20%, 56% { opacity: 0.85; } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
      @keyframes rain { from { transform: translate(0, -340px); } to { transform: translate(-40px, 340px); } }
      @keyframes glitchA { 0%, 89%, 100% { transform: translate(0, 0); } 90% { transform: translate(-4px, 1px); } 93% { transform: translate(3px, -1px); } 96% { transform: translate(-2px, 0); } }
      @keyframes glitchB { 0%, 89%, 100% { transform: translate(0, 0); } 90% { transform: translate(4px, -1px); } 93% { transform: translate(-3px, 1px); } 96% { transform: translate(2px, 0); } }
      @keyframes sweep { from { transform: translateY(-80px); } to { transform: translateY(340px); } }
      @media (prefers-reduced-motion: reduce) { .sign, .win, .rain, .glitch-a, .glitch-b, .cursor, .sweep { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#night)"/>

    <!-- Skyline -->
    <g fill="#160936">
      <rect x="0" y="190" width="70" height="60"/><rect x="70" y="215" width="50" height="35"/>
      <rect x="120" y="175" width="80" height="75"/><rect x="200" y="205" width="60" height="45"/>
      <rect x="260" y="165" width="90" height="85"/><rect x="350" y="200" width="50" height="50"/>
      <rect x="400" y="185" width="70" height="65"/><rect x="470" y="160" width="100" height="90"/>
      <rect x="570" y="210" width="60" height="40"/><rect x="630" y="180" width="80" height="70"/>
      <rect x="710" y="195" width="50" height="55"/><rect x="760" y="155" width="110" height="95"/>
      <rect x="870" y="205" width="60" height="45"/><rect x="930" y="175" width="80" height="75"/>
      <rect x="1010" y="200" width="60" height="50"/><rect x="1070" y="170" width="90" height="80"/>
      <rect x="1160" y="210" width="40" height="40"/>
    </g>
    <g>
      <rect x="138" y="186" width="5" height="3" fill="#29F3FF"/><rect x="162" y="198" width="5" height="3" fill="#FF2BD6" class="win"/>
      <rect x="280" y="176" width="5" height="3" fill="#FFE45E"/><rect x="318" y="190" width="5" height="3" fill="#29F3FF" class="win" style="animation-delay: -1s"/>
      <rect x="492" y="172" width="5" height="3" fill="#FF2BD6"/><rect x="540" y="186" width="5" height="3" fill="#29F3FF"/>
      <rect x="652" y="192" width="5" height="3" fill="#FFE45E" class="win" style="animation-delay: -2s"/><rect x="784" y="168" width="5" height="3" fill="#29F3FF"/>
      <rect x="832" y="182" width="5" height="3" fill="#FF2BD6" class="win" style="animation-delay: -0.5s"/><rect x="950" y="188" width="5" height="3" fill="#FFE45E"/>
      <rect x="1092" y="182" width="5" height="3" fill="#29F3FF" class="win" style="animation-delay: -2.5s"/><rect x="1130" y="196" width="5" height="3" fill="#FF2BD6"/>
    </g>

    <!-- Neon grid floor -->
    <rect x="0" y="250" width="1200" height="70" fill="url(#floor)"/>
    <g clip-path="url(#ground)" stroke="#FF2BD6" stroke-width="1.5" fill="none">
      <g opacity="0.55">
        <path d="M600 250 L-600 320 M600 250 L-300 320 M600 250 L0 320 M600 250 L200 320 M600 250 L400 320 M600 250 L600 320 M600 250 L800 320 M600 250 L1000 320 M600 250 L1200 320 M600 250 L1500 320 M600 250 L1800 320"/>
      </g>
      <line x1="0" y1="255" x2="1200" y2="255" opacity="0.25"/>
      <line x1="0" y1="262" x2="1200" y2="262" opacity="0.35"/>
      <line x1="0" y1="272" x2="1200" y2="272" opacity="0.45"/>
      <line x1="0" y1="286" x2="1200" y2="286" opacity="0.6"/>
      <line x1="0" y1="306" x2="1200" y2="306" opacity="0.75"/>
    </g>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#29F3FF" stroke-width="2" filter="url(#glow)" opacity="0.8"/>

    <!-- Rain -->
    <g stroke="#7CF9FF" stroke-width="1.2" opacity="0.35" stroke-linecap="round">
      <line class="rain" x1="40" y1="0" x2="34" y2="28" style="animation-duration: 1.4s"/>
      <line class="rain" x1="150" y1="40" x2="144" y2="68" style="animation-duration: 1.7s; animation-delay: -0.4s"/>
      <line class="rain" x1="260" y1="10" x2="254" y2="38" style="animation-duration: 1.3s; animation-delay: -0.9s"/>
      <line class="rain" x1="380" y1="60" x2="374" y2="88" style="animation-duration: 1.6s; animation-delay: -0.2s"/>
      <line class="rain" x1="470" y1="20" x2="464" y2="48" style="animation-duration: 1.5s; animation-delay: -1.1s"/>
      <line class="rain" x1="590" y1="50" x2="584" y2="78" style="animation-duration: 1.8s; animation-delay: -0.6s"/>
      <line class="rain" x1="700" y1="0" x2="694" y2="28" style="animation-duration: 1.4s; animation-delay: -1.3s"/>
      <line class="rain" x1="810" y1="30" x2="804" y2="58" style="animation-duration: 1.6s; animation-delay: -0.8s"/>
      <line class="rain" x1="920" y1="70" x2="914" y2="98" style="animation-duration: 1.3s; animation-delay: -0.3s"/>
      <line class="rain" x1="1030" y1="15" x2="1024" y2="43" style="animation-duration: 1.7s; animation-delay: -1.0s"/>
      <line class="rain" x1="1130" y1="45" x2="1124" y2="73" style="animation-duration: 1.5s; animation-delay: -0.5s"/>
      <line class="rain" x1="1220" y1="5" x2="1214" y2="33" style="animation-duration: 1.4s; animation-delay: -1.2s"/>
    </g>

    <!-- Vertical neon sign: 趣味 (shumi, hobbies) -->
    <g class="sign">
      <rect x="56" y="46" width="100" height="196" rx="14" fill="#12052E" stroke="#FF2BD6" stroke-width="3" filter="url(#glow)"/>
      <text class="jp" x="106" y="132" font-size="62" font-weight="700" fill="#FF6BE6" text-anchor="middle" filter="url(#glow)">趣</text>
      <text class="jp" x="106" y="214" font-size="62" font-weight="700" fill="#FF6BE6" text-anchor="middle" filter="url(#glow)">味</text>
    </g>

    <!-- Glitchy title -->
    <g class="mono" font-size="28" font-weight="700">
      <text class="glitch-a" x="210" y="76" fill="#FF2BD6" opacity="0.7">// INTERESTS</text>
      <text class="glitch-b" x="210" y="76" fill="#29F3FF" opacity="0.7">// INTERESTS</text>
      <text x="210" y="76" fill="#E8FDFF" filter="url(#glow)">// INTERESTS</text>
    </g>
    <text class="mono" x="1170" y="74" font-size="14" fill="#7CF9FF" opacity="0.75" text-anchor="end">SYS.ONLINE <tspan class="cursor">▮</tspan></text>

    <!-- Card: photography -->
    <g transform="translate(210 104)">
      <rect width="300" height="116" rx="14" fill="#0E0726" fill-opacity="0.88" stroke="#29F3FF" stroke-width="2.5" filter="url(#glow)"/>
      <g transform="translate(62 60)" fill="none" stroke="#29F3FF" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
        <rect x="-32" y="-20" width="64" height="44" rx="8"/>
        <rect x="-16" y="-30" width="24" height="10" rx="3"/>
        <circle cx="0" cy="2" r="14"/>
        <circle cx="0" cy="2" r="6"/>
        <circle cx="21" cy="-10" r="2" fill="#29F3FF"/>
      </g>
      <text class="mono" x="118" y="54" font-size="24" font-weight="700" fill="#29F3FF" filter="url(#glow)">PHOTOGRAPHY</text>
      <text class="mono" x="118" y="86" font-size="17" fill="#C9D0FF">chasing golden hour</text>
    </g>

    <!-- Card: gaming -->
    <g transform="translate(540 104)">
      <rect width="300" height="116" rx="14" fill="#0E0726" fill-opacity="0.88" stroke="#FF2BD6" stroke-width="2.5" filter="url(#glow)"/>
      <g transform="translate(62 60)" fill="none" stroke="#FF2BD6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
        <path d="M-20 -16 H20 Q36 -16 38 4 L40 14 Q41 26 30 26 Q23 26 18 16 H-18 Q-23 26 -30 26 Q-41 26 -40 14 L-38 4 Q-36 -16 -20 -16 Z"/>
        <path d="M-22 -4 V8 M-28 2 H-16"/>
        <circle cx="18" cy="-2" r="2.5" fill="#FF2BD6"/>
        <circle cx="26" cy="6" r="2.5" fill="#FF2BD6"/>
      </g>
      <text class="mono" x="118" y="54" font-size="24" font-weight="700" fill="#FF6BE6" filter="url(#glow)">GAMING</text>
      <text class="mono" x="118" y="86" font-size="17" fill="#C9D0FF">player 1 ready</text>
    </g>

    <!-- Card: reading -->
    <g transform="translate(870 104)">
      <rect width="300" height="116" rx="14" fill="#0E0726" fill-opacity="0.88" stroke="#FFE45E" stroke-width="2.5" filter="url(#glow)"/>
      <g transform="translate(62 60)" fill="none" stroke="#FFE45E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
        <path d="M0 -18 Q-18 -26 -36 -20 V22 Q-18 16 0 24 Z"/>
        <path d="M0 -18 Q18 -26 36 -20 V22 Q18 16 0 24 Z"/>
        <path d="M-28 -8 Q-16 -12 -8 -8 M-28 2 Q-16 -2 -8 2 M8 -8 Q16 -12 28 -8 M8 2 Q16 -2 28 2" stroke-width="2"/>
      </g>
      <text class="mono" x="118" y="54" font-size="24" font-weight="700" fill="#FFE45E" filter="url(#glow)">READING</text>
      <text class="mono" x="118" y="86" font-size="17" fill="#C9D0FF">one more chapter…</text>
    </g>

    <!-- Scanlines and a slow sweep -->
    <rect class="sweep" x="0" y="0" width="1200" height="80" fill="url(#sweep)"/>
    <rect width="1200" height="320" fill="url(#scan)"/>
  </g>
</svg>
